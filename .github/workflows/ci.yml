# Tests and audits of Tocsin, on every push to main and on every pull request.
# - No key and no secret: the tests never reach the network (collector/tests/conftest.py blocks
#   it, DNS included) and the site is checked with test cards.
# - Read-only rights for every job, and never pull_request_target.
# - Actions pinned by commit, tools at exact versions; Dependabot proposes the updates.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collector:
    name: Collector tests (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the pinned dependencies, and nothing else
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-dev.txt
          python -m pip check
      - name: Run the tests
        run: python -m pytest

  # The README promises Python 3.12 or newer: the same tests with the latest stable Python. Not a
  # required check of main, so that a new Python can only warn, never block a change.
  collector-latest-python:
    name: Collector tests (latest Python)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
          check-latest: true
      - name: Install the pinned dependencies, and nothing else
        run: |
          python --version
          python -m pip install --disable-pip-version-check --no-deps -r requirements-dev.txt
          python -m pip check
      - name: Run the tests
        run: python -m pytest

  site:
    name: Site checks (npm run check)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the locked dependencies, without running their install scripts
        run: npm ci --ignore-scripts
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Build the site and drive it in a browser
        run: npm run check

  secrets:
    name: Secret scan (gitleaks, whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1, checksum verified
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt of the official release; the GitHub API gives the same.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan every commit
        run: |
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --config .gitleaks.toml --log-opts="--all" .

  audits:
    name: Audits (pip-audit, npm audit, Bandit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install the audit tools, pinned
        run: |
          python -m pip install --disable-pip-version-check --no-deps -r requirements-audit.txt
          python -m pip check
      - name: pip-audit, on the Python dependencies
        run: python -m pip_audit --strict --no-deps --disable-pip -r requirements.txt -r requirements-dev.txt -r requirements-audit.txt
      - name: npm audit, on the site dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Bandit, on the collector code
        run: python -m bandit -r collector -x collector/tests
